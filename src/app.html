<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Bocchi Tagger</title>
    <!-- the loading screen is plain HTML so it shows before any JavaScript, +layout.svelte fades it out -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #13152c;
        color: #f2f2f7;
        font: 600 1.1rem system-ui, sans-serif;
        transition: opacity 250ms ease-out;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: light) {
        #splash {
          background: #ffffff;
          color: #1a1a1a;
        }
      }
      #splash .icon {
        width: 6rem;
        height: 6rem;
        border-radius: 50%;
        animation: splash-pulse 900ms ease-in-out infinite alternate;
      }
      @keyframes splash-pulse {
        from { transform: scale(0.94); opacity: 0.75; }
        to { transform: scale(1); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash * { animation: none !important; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash">
      <img class="icon" src="%sveltekit.assets%/icon-192.png" alt="" />
      <span>Bocchi Tagger</span>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
