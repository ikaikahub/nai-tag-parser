name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows
        type: boolean
        default: true
      linux:
        description: Build Linux
        type: boolean
        default: true
      android:
        description: Build Android
        type: boolean
        default: true
      release_tag:
        description: Release tag (e.g. v0.1.0). Leave empty to only upload artifacts.
        type: string
        required: false

permissions:
  contents: write

# a newer run on the same branch or tag stops the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# tag pushes build everything and release under that tag, manual runs use the inputs
env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.matrix.outputs.desktop }}
    steps:
      - id: matrix
        run: |
          items=()
          if [ "${{ github.event_name == 'push' || inputs.windows }}" = "true" ]; then items+=('{"platform":"windows-latest","name":"windows","bundles":"nsis"}'); fi
          if [ "${{ github.event_name == 'push' || inputs.linux }}" = "true" ]; then items+=('{"platform":"ubuntu-22.04","name":"linux","bundles":"appimage,deb,rpm"}'); fi
          echo "desktop=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: bocchi-tagger-${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  android:
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.13846066
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: chmod +x src-tauri/gen/android/gradlew

      - name: Set up signing key
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
         echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
         esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
         {
           echo "keyAlias=$(esc "$KEY_ALIAS")"
           echo "password=$(esc "$KEY_PASSWORD")"
           echo "storeFile=$RUNNER_TEMP/release.jks"
         } > src-tauri/gen/android/keystore.properties
               cut -d= -f1 src-tauri/gen/android/keystore.properties

      - run: pnpm tauri android build --apk --target aarch64

      - name: Rename APK
        run: |
          mkdir -p dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "dist/bocchi-tagger-${{ env.RELEASE_TAG || github.sha }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bocchi-tagger-android
          retention-days: 1
          if-no-files-found: error
          path: dist/*.apk

  release:
    needs: [desktop, android]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.release_tag != '') && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
