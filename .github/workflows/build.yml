name: Build

run-name: ${{ inputs.release_tag || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows
        type: boolean
        default: true
      linux:
        description: Build Linux
        type: boolean
        default: true
      android:
        description: Build Android
        type: boolean
        default: true
      release_tag:
        description: Release tag (e.g. v0.1.0). Leave empty to only upload artifacts.
        type: string
        required: false

permissions:
  contents: write

# a newer run for the same release, or the same branch without one, stops the older one.
# releases all run on the branch now, so grouping by branch alone would cancel one release with the next
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

# pnpm release starts manual runs on the branch so they share the build cache. a pushed tag still builds
# everything and releases under that tag
env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.matrix.outputs.desktop }}
    steps:
      - id: matrix
        run: |
          items=()
          if [ "${{ github.event_name == 'push' || inputs.windows }}" = "true" ]; then items+=('{"platform":"windows-latest","name":"windows","bundles":"nsis"}'); fi
          if [ "${{ github.event_name == 'push' || inputs.linux }}" = "true" ]; then items+=('{"platform":"ubuntu-22.04","name":"linux","bundles":"appimage,deb,rpm"}'); fi
          echo "desktop=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: bocchi-tagger-${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig

  android:
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.13846066
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: chmod +x src-tauri/gen/android/gradlew

      - name: Set up signing key
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
         echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
         esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
         {
           echo "keyAlias=$(esc "$KEY_ALIAS")"
           echo "password=$(esc "$KEY_PASSWORD")"
           echo "storeFile=$RUNNER_TEMP/release.jks"
         } > src-tauri/gen/android/keystore.properties
               cut -d= -f1 src-tauri/gen/android/keystore.properties

      - run: pnpm tauri android build --apk --target aarch64

      - name: Rename APK
        run: |
          mkdir -p dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "dist/bocchi-tagger-${{ env.RELEASE_TAG || github.sha }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bocchi-tagger-android
          retention-days: 1
          if-no-files-found: error
          path: dist/*.apk

  release:
    needs: [desktop, android]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.release_tag != '') && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set release title
        id: release_title
        run: echo "title=${RELEASE_TAG} - $(date -u +%F)" >> "$GITHUB_OUTPUT"

      # desktop artifacts keep their nsis/, appimage/, deb/ and rpm/ folders, but the release only takes dist/*
      - name: Flatten downloads
        run: find dist -mindepth 2 -type f -exec mv -t dist {} +

      # the in-app updater reads this from the latest release
      - name: Write update manifest
        run: |
          python3 - <<'EOF'
          import datetime, json, os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+', tag):
              print(f'{tag} is not a vN release, skipping latest.json')
              raise SystemExit(0)
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          platforms = {}
          # each linux format needs its own entry, the updater looks for os-arch-format before os-arch
          formats = [
              ('windows-x86_64', '*-setup.exe'),
              ('linux-x86_64-appimage', '*.AppImage'),
              ('linux-x86_64-deb', '*.deb'),
              ('linux-x86_64-rpm', '*.rpm'),
          ]
          for target, pattern in formats:
              for installer in pathlib.Path('dist').glob(pattern):
                  signature = pathlib.Path(f'{installer}.sig')
                  if signature.exists():
                      # GitHub turns spaces in asset names into dots
                      platforms[target] = {'signature': signature.read_text(), 'url': base + installer.name.replace(' ', '.')}
          if not platforms:
              print('No signed installers, skipping latest.json')
              raise SystemExit(0)
          manifest = {
              'version': f'0.0.{tag[1:]}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'platforms': platforms,
          }
          pathlib.Path('dist/latest.json').write_text(json.dumps(manifest, indent=2))
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.release_title.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: dist/*
