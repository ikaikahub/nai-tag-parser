<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 222">
  <defs>
    <!-- the dark inner part is a soft pillow sitting slightly up and left, its sides bulge out a little -->
    <path
      id="pillow"
      d="M-22 -43 C-6 -45 12 -44 22 -42 C35 -40 41 -33 41 -20 C43 -4 43 8 41 20 C39 34 32 40 18 41
         C2 43 -12 43 -24 41 C-37 39 -43 32 -43 18 C-45 2 -45 -10 -43 -22 C-42 -36 -36 -42 -22 -43 Z"
    />
    <!-- thin gloss hugging the top-left corner, widest at the corner and tapering along both edges -->
    <path
      id="gloss"
      d="M6 -44.5 C-12 -46 -30 -46.5 -38 -43 C-44 -39.5 -45.5 -28 -45 -4
         C-42.5 -22 -41 -32 -37 -36.5 C-30 -41 -14 -41.5 6 -44.5 Z"
    />
  </defs>

  <!-- blue cube, tilted clockwise -->
  <g transform="translate(70 59) rotate(5.5) scale(0.95)">
    <rect x="-50" y="-50" width="100" height="100" rx="12" fill="#88d6f1" stroke="#5aa8cb" stroke-width="1.2" />
    <use href="#pillow" fill="#4083a5" />
    <use href="#gloss" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- yellow cube, tilted slightly anticlockwise -->
  <g transform="translate(67 164) rotate(-3) scale(0.97)">
    <rect x="-50" y="-50" width="100" height="100" rx="12" fill="#efde6c" stroke="#c4a843" stroke-width="1.2" />
    <use href="#pillow" fill="#a28b35" />
    <use href="#gloss" fill="#fffbe6" opacity="0.95" />
  </g>
</svg>
